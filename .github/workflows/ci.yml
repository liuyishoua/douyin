name: Standalone console checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python start.py --setup-only
      - run: .venv/bin/python -m unittest web.test_origin web.test_process_lock
      - run: node --check web/static/app.js
      - run: bash -n start.sh start.command
